<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" fill="url(#bg)" rx="12" />

  <!-- Decorative Elements -->
  <circle cx="780" cy="40" r="80" fill="#7c3aed" opacity="0.06" />
  <circle cx="100" cy="160" r="60" fill="#a78bfa" opacity="0.05" />
  <circle cx="440" cy="100" r="120" fill="#7c3aed" opacity="0.03" />

  <!-- Top accent line -->
  <rect x="0" y="0" width="880" height="3" fill="url(#accent)" rx="2" />

  <!-- Name -->
  <text x="440" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">
    Linh Nguyen
  </text>

  <!-- Title -->
  <text x="440" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#a78bfa" text-anchor="middle" letter-spacing="2" filter="url(#glow)">
    MOBILE DEVELOPER
  </text>

  <!-- Subtitle -->
  <text x="440" y="140" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#8b949e" text-anchor="middle" letter-spacing="1">
    React Native · Flutter · SwiftUI · Jetpack Compose
  </text>

  <!-- Bottom dots decoration -->
  <circle cx="400" cy="170" r="2" fill="#7c3aed" opacity="0.6" />
  <circle cx="420" cy="170" r="2" fill="#a78bfa" opacity="0.4" />
  <circle cx="440" cy="170" r="2" fill="#7c3aed" opacity="0.6" />
  <circle cx="460" cy="170" r="2" fill="#a78bfa" opacity="0.4" />
  <circle cx="480" cy="170" r="2" fill="#7c3aed" opacity="0.6" />
</svg>
